name: Validar EriMax - Métricas

on:
  push:
    branches:
      - melhoria/reincidencias-agrupadas-2026-11-22
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar pacote web
        run: npm run build
      - name: Verificar scripts e estrutura da página Métricas
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const match of scripts) {
            const attrs = match[1];
            const source = match[2].trim();
            if (!source || /\bsrc\s*=/.test(attrs) || /type\s*=\s*["']?(application\/json|importmap)/i.test(attrs)) continue;
            new vm.Script(source, { filename: 'index.html:inline-script-' + (++checked) + '.js' });
          }
          if (!checked) throw new Error('Nenhum script inline foi encontrado para validação');
          for (const id of ['cardRankingReincidencia', 'listaRankingReincidencia']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Elemento obrigatório ausente: ' + id);
          }
          if (!html.includes('function abrirDetalheMetrica')) throw new Error('Função de detalhe das métricas ausente');
          if (!html.includes('OS_MTBF_ATUAL.push(os)') || !html.includes('lista=mtbfDados')) throw new Error('Detalhe do MTBF não está usando a mesma base produtiva do indicador');
          console.log('OK: ' + checked + ' scripts inline, estrutura da página Métricas e escopo do detalhe MTBF verificados.');
          NODE

      - name: Testar classificação automática de reincidências
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('function normalizarIdentificadorReincidencia');
          const end = html.indexOf('let REINCIDENCIA_SELECAO=null;', start);
          if (start < 0 || end < 0) throw new Error('Classificador de reincidências não encontrado');
          const resolverStart = html.indexOf('function resolverIdMaquinaRegistro');
          const resolverEnd = html.indexOf('\n', resolverStart);
          if (resolverStart < 0 || resolverEnd < 0) throw new Error('Resolvedor de máquina por ID não encontrado');
          const source = html.slice(start, end) + '\n' + html.slice(resolverStart, resolverEnd) + '\n globalThis.api = { calcularReincidenciasHistorico };';
          const context = { MAQUINAS: [] };
          vm.createContext(context);
          vm.runInContext(source, context);
          const os = (id, maquina, setor, descricao, dia) => ({
            id, maquina, setor, descricao, status: 'Concluída', tipo: 'Corretiva',
            created_at: '2026-11-' + dia + 'T08:00:00'
          });
          const casos = [
            os(1, 'Flowpack 5', 'Corte atadura', 'Problema no datador', '01'),
            os(2, 'Flowpack 5', 'Corte atadura', ' PROBLEMA   NO DATADOR! ', '02'),
            os(3, 'Flowpack 7', 'Corte atadura', 'Problema no datador', '03'),
            os(4, 'Flowpack 5', 'Outro setor', 'Problema no datador', '04'),
            os(5, 'Flowpack 8', 'Corte atadura', 'Esteira travando', '05'),
            os(6, 'Flowpack 8', 'Corte atadura', 'Esteira travada', '06'),
            os(7, 'Flowpack 9', 'Corte atadura', 'Faca de trás', '07'),
            os(8, 'Flowpack 9', 'Corte atadura', 'Faca cortando errado', '08')
          ];
          const resultado = context.api.calcularReincidenciasHistorico(casos);
          const assert = (ok, message) => { if (!ok) throw new Error(message); };
          assert(resultado.has('2') && resultado.get('2').primeiraOS.id === 1, 'Não agrupou descrição idêntica normalizada com a primeira O.S.');
          assert(!resultado.has('3'), 'Misturou máquinas diferentes');
          assert(!resultado.has('4'), 'Misturou setores diferentes');
          assert(resultado.has('6') && resultado.get('6').primeiraOS.id === 5, 'Não reconheceu variação verbal segura');
          assert(!resultado.has('8'), 'Agrupou defeitos diferentes por palavra genérica');
          context.MAQUINAS = [
            { id: 100, nome: 'SELADORA', setor: 'MESA' },
            { id: 101, nome: 'SELADORA', setor: 'MESA' }
          ];
          const casosIds = [
            { ...os(10, 'SELADORA', 'MESA', 'Falha no motor', '10'), maquina_id: 100 },
            { ...os(11, 'SELADORA', 'MESA', 'Falha no motor', '11'), maquina_id: 101 },
            { ...os(12, 'SELADORA', 'MESA', 'Falha no motor', '12'), maquina_id: 100 }
          ];
          const resultadoIds = context.api.calcularReincidenciasHistorico(casosIds);
          assert(resultadoIds.has('12') && resultadoIds.get('12').primeiraOS.id === 10, 'Não agrupou reincidência da mesma máquina pelo ID');
          assert(!resultadoIds.has('11'), 'Misturou máquinas com o mesmo nome e setor, mas IDs diferentes');
          console.log('OK: normalização, agrupamento por ID, escopo máquina/setor e prevenção de falso positivo.');
          NODE
