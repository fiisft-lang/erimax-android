name: Publicar atualização OTA do EriMax

on:
  push:
    branches:
      - main
      - ota-atualizacao-android-staging-20261109
    paths-ignore:
      - "ota/**"

permissions:
  contents: write

concurrency:
  group: erimax-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar pacote web do aplicativo
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            export ERIMAX_BUILD_ID="${GITHUB_SHA}"
            npm install
            npm run build
            echo "OTA_BUNDLE_ID=${GITHUB_SHA}" >> "$GITHUB_ENV"
          else
            # APKs antigos podem estar fixados no canal staging. Publica nele
            # o mesmo aplicativo validado em main, sem deixar o canal defasado.
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            mkdir -p /tmp/erimax-main
            git archive "$MAIN_SHA" | tar -x -C /tmp/erimax-main
            cd /tmp/erimax-main
            export ERIMAX_BUILD_ID="$MAIN_SHA"
            npm install
            npm run build
            # A etapa seguinte roda novamente na pasta original do checkout.
            # Copia o build principal para lá para que o ZIP não use www antigo.
            mkdir -p "$GITHUB_WORKSPACE/www"
            cp -a www/. "$GITHUB_WORKSPACE/www/"
            echo "OTA_BUNDLE_ID=$MAIN_SHA" >> "$GITHUB_ENV"
          fi
          test -s www/index.html
          test -s www/ota-update.js

      - name: Montar pacote e manifesto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ota
          BUNDLE_ID="${OTA_BUNDLE_ID:-$(git rev-parse HEAD)}"
          zip -j -q ota/latest.zip www/*
          PACKAGED_BUILD_ID="$(unzip -p ota/latest.zip ota-build.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).bundleId||'')}catch(e){process.exit(1)}})")"
          if [ "$PACKAGED_BUILD_ID" != "$BUNDLE_ID" ]; then
            echo "ERRO: o pacote contém build $PACKAGED_BUILD_ID, mas o manifesto anunciaria $BUNDLE_ID."
            exit 1
          fi
          CHECKSUM="$(sha256sum ota/latest.zip | awk '{print $1}')"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            CHANNEL="production"
          else
            CHANNEL="staging"
          fi
          ORIGIN="https://raw.githubusercontent.com/fiisft-lang/erimax-android/${GITHUB_REF_NAME}"
          cat > ota/manifest.json <<EOF
          {
            "bundleId": "${BUNDLE_ID}",
            "channel": "${CHANNEL}",
            "url": "${ORIGIN}/ota/latest.zip?v=${BUNDLE_ID}",
            "checksum": "${CHECKSUM}",
            "minimumNativeVersionCode": 1,
            "message": "Há melhorias e correções disponíveis no EriMax."
          }
          EOF
          unzip -t ota/latest.zip
          cat ota/manifest.json

      - name: Publicar pacote no Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/latest.zip ota/manifest.json
          if git diff --cached --quiet; then
            echo "O pacote OTA já está atualizado."
            exit 0
          fi
          git commit -m "chore(ota): atualizar pacote de atualização"
          git push origin "HEAD:${GITHUB_REF_NAME}"
