name: Validar automação de preventivas

on:
  push:
    branches:
      - feat/automacao-os-preventiva
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar Edge Function
        run: deno check supabase/functions/automacao-preventivas/index.ts
