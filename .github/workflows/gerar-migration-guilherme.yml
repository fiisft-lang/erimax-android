name: Gerar migration via Supabase CLI
on:
  push:
    branches:
      - tmp-cli-migration-guilherme
    paths:
      - ".github/workflows/gerar-migration-guilherme.yml"
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-cli-migration-guilherme
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Criar arquivo pelo comando oficial
        run: supabase migration new permitir_guilherme_como_tecnico
      - name: Registrar arquivo gerado
        run: |
          set -euo pipefail
          FILE="$(find supabase/migrations -maxdepth 1 -type f -name '*_permitir_guilherme_como_tecnico.sql' -print -quit)"
          test -n "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(db): gerar migration de acesso técnico do Guilherme"
          git push origin HEAD:tmp-cli-migration-guilherme
