name: Validar migration de dupla função TEC

on:
  push:
    branches:
      - feat/automacao-os-preventiva
    paths:
      - .github/workflows/validar-dupla-funcao.yml
      - supabase/tests/dual_role_functions_setup.sql
      - supabase/tests/dual_role_functions_assert.sql
      - supabase/migrations/20261126141318_permitir_guilherme_como_tecnico.sql

permissions:
  contents: write

concurrency:
  group: validar-dupla-funcao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erimax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erimax_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Criar migration com o CLI e testar SQL
        env:
          PGPASSWORD: postgres
        run: |
          supabase migration new permitir_dupla_funcao_fii_guilherme
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_permitir_dupla_funcao_fii_guilherme.sql' -print -quit)"
          test -n "$generated"
          cp supabase/migrations/20261126141318_permitir_guilherme_como_tecnico.sql "$generated"

          psql -h localhost -U postgres -d erimax_test -v ON_ERROR_STOP=1 -f supabase/tests/dual_role_functions_setup.sql
          psql -h localhost -U postgres -d erimax_test -v ON_ERROR_STOP=1 -f "$generated"
          psql -h localhost -U postgres -d erimax_test -v ON_ERROR_STOP=1 -f supabase/tests/dual_role_functions_assert.sql
          echo "MIGRATION_FILE=$generated" >> "$GITHUB_ENV"

      - name: Guardar migration validada
        uses: actions/upload-artifact@v4
        with:
          name: migration-dupla-funcao-tec
          path: supabase/migrations/*_permitir_dupla_funcao_fii_guilherme.sql
          if-no-files-found: error

      - name: Registrar migration gerada pelo CLI
        run: |
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_permitir_dupla_funcao_fii_guilherme.sql' -print -quit)"
          test -n "$generated"
          git rm supabase/migrations/20261126141318_permitir_guilherme_como_tecnico.sql
          git add "$generated"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(db): gerar migration com Supabase CLI"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push origin "HEAD:$GITHUB_REF_NAME"
