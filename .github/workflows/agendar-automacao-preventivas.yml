name: Agendar automação de preventivas

on:
  schedule:
    # Brasília (UTC-3): verifica horários configurados a cada 15 minutos, de 06:00 a 22:45.
    # A segunda regra cobre 21:00-22:45 locais, que caem no dia UTC seguinte.
    - cron: "*/15 9-23 * * 1-6"
    - cron: "*/15 0-1 * * 0,2-6"

permissions:
  contents: read

concurrency:
  group: automacao-preventivas-producao
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validar configuração
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Secret SUPABASE_URL não configurado."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY não configurado."; exit 1; }

      - name: Executar automação de preventivas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${SUPABASE_URL%/}/functions/v1/automacao-preventivas" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
