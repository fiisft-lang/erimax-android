name: Gerar APK EriMax
# Build de staging após correção da sintaxe do login

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - finalizar-exportacao-android-20261109
      - incoming-call-alert-staging
      - melhorias-integradas-final-staging
      - ota-atualizacao-android-staging-20261109
    paths-ignore:
      - "ota/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Preparar aplicativo com Firebase
        env:
          ERIMAX_BUILD_ID: ${{ github.sha }}
        run: |
          npm run build
          if [ "$GITHUB_REF_NAME" = "ota-atualizacao-android-staging-20261109" ]; then
            node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.plugins.LiveUpdate.defaultChannel='staging';fs.writeFileSync(p,JSON.stringify(c,null,2)+'\\n');"
          fi
          npx cap add android
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          mkdir -p android/app/src/main/java/com/webapp/erimaxmanuteno
          cp android-native/IncomingCallMessagingService.java android/app/src/main/java/com/webapp/erimaxmanuteno/
          cp android-native/IncomingCallActivity.java android/app/src/main/java/com/webapp/erimaxmanuteno/
          cp android-native/EriMaxExportPlugin.java android/app/src/main/java/com/webapp/erimaxmanuteno/
          mkdir -p android/app/src/main/res/raw
          cp alarme.wav android/app/src/main/res/raw/alarme.wav
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          ET.register_namespace("tools", "http://schemas.android.com/tools")
          A = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(p).getroot()
          def ensure(tag, attrs):
              for el in root.findall(tag):
                  if all(el.get(k) == v for k,v in attrs.items()): return el
              el = ET.SubElement(root, tag)
              for k,v in attrs.items(): el.set(k,v)
              return el
          ensure("uses-permission", {A+"name":"android.permission.USE_FULL_SCREEN_INTENT"})
          ensure("uses-permission", {A+"name":"android.permission.VIBRATE"})
          app = root.find("application")
          if app is None: raise SystemExit("AndroidManifest sem application")
          for service in list(app.findall("service")):
              if service.get(A+"name") == "com.capacitorjs.plugins.pushnotifications.MessagingService":
                  app.remove(service)
          service = ET.SubElement(app, "service", {A+"name":"com.webapp.erimaxmanuteno.IncomingCallMessagingService", A+"exported":"false"})
          filt = ET.SubElement(service, "intent-filter")
          ET.SubElement(filt, "action", {A+"name":"com.google.firebase.MESSAGING_EVENT"})
          activity = ET.SubElement(app, "activity", {
              A+"name":"com.webapp.erimaxmanuteno.IncomingCallActivity",
              A+"exported":"false", A+"showWhenLocked":"true", A+"turnScreenOn":"true",
              A+"excludeFromRecents":"true", A+"launchMode":"singleTop",
              A+"theme":"@android:style/Theme.Material.Light.NoActionBar"
          })
          main = next((x for x in app.findall("activity") if x.get(A+"name") in (".MainActivity","com.webapp.erimaxmanuteno.MainActivity")), None)
          if main is None: raise SystemExit("MainActivity não encontrada")
          deep = ET.SubElement(main, "intent-filter")
          ET.SubElement(deep, "action", {A+"name":"android.intent.action.VIEW"})
          ET.SubElement(deep, "category", {A+"name":"android.intent.category.DEFAULT"})
          ET.SubElement(deep, "category", {A+"name":"android.intent.category.BROWSABLE"})
          ET.SubElement(deep, "data", {A+"scheme":"erimax", A+"host":"os"})
          ET.ElementTree(root).write(p, encoding="utf-8", xml_declaration=True)
          PY
          npx cap sync android
          # Registrar o plugin customizado DEPOIS do cap sync, garantindo que a MainActivity final do APK o carregue.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/java/com/webapp/erimaxmanuteno/MainActivity.java")
          if not p.exists():
              raise SystemExit("MainActivity.java não foi gerada pelo Capacitor")
          source = p.read_text()
          if "import com.webapp.erimaxmanuteno.EriMaxExportPlugin;" not in source:
              source = source.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport com.webapp.erimaxmanuteno.EriMaxExportPlugin;"
              )
          if "registerPlugin(EriMaxExportPlugin.class)" not in source:
              pattern = r"(public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{)"
              method = """\\1
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(EriMaxExportPlugin.class);
                  super.onCreate(savedInstanceState);
              }
              """
              source, count = re.subn(pattern, method, source, count=1)
              if count != 1:
                  raise SystemExit("Não foi possível registrar EriMaxExportPlugin na MainActivity")
          if "registerPlugin(EriMaxExportPlugin.class)" not in source:
              raise SystemExit("Registro do EriMaxExportPlugin ausente")
          p.write_text(source)
          print("Registro nativo confirmado em MainActivity.java")
          PY
          grep -n "EriMaxExportPlugin\\|registerPlugin" android/app/src/main/java/com/webapp/erimaxmanuteno/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              root_text, count = re.subn(
                  r"(dependencies\s*\{)",
                  r"\1\n        classpath 'com.google.gms:google-services:4.4.2'",
                  root_text,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Não foi possível configurar o plugin Google Services no android/build.gradle")
              root.write_text(root_text)

          app = Path("android/app/build.gradle")
          app_text = app.read_text()
          dependency = "implementation 'com.google.firebase:firebase-messaging:24.1.0'"
          if dependency not in app_text:
              app_text, count = re.subn(
                  r"(dependencies\s*\{)",
                  r"\1\n    " + dependency,
                  app_text,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Bloco dependencies não encontrado em android/app/build.gradle")
          if "com.google.gms.google-services" not in app_text:
              app_text += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(app_text)
          PY
          echo "Dependência Firebase Messaging configurada:"
          grep -n "firebase-messaging\\|google-services" android/app/build.gradle android/build.gradle
          
      - name: Baixar e aplicar logotipo original ERIMAX
        run: |
          python3 -m pip install --quiet pillow
          FILE_ID="1GdV-masHmMERIoBgoMJKYzwP1FIO-bYt"
          DOWNLOADED=0
          for URL in \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}&confirm=t"; do
            if curl --fail --location --retry 2 --retry-delay 2 --user-agent "Mozilla/5.0" "$URL" --output /tmp/erimax-logo-original; then
              if python3 -c "from PIL import Image; Image.open('/tmp/erimax-logo-original').verify()" 2>/dev/null; then
                DOWNLOADED=1
                break
              fi
            fi
            echo "Resposta do Google Drive não era uma imagem válida; tentando outro endereço."
          done
          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "Não foi possível baixar o logotipo original como imagem."
            head -c 240 /tmp/erimax-logo-original || true
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import xml.etree.ElementTree as ET

          logo_path = "/tmp/erimax-logo-original"
          check = Image.open(logo_path)
          check.verify()
          source = Image.open(logo_path).convert("RGB")

          # Remove only the outer white margin, preserving the complete original mark and lettering.
          white = Image.new("RGB", source.size, "white")
          diff = ImageChops.difference(source, white).convert("L")
          mask = diff.point(lambda value: 255 if value > 28 else 0)
          bounds = mask.getbbox()
          if bounds:
              source = source.crop(bounds)

          res = Path("android/app/src/main/res")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              # White square app icon with the entire logo centered and uncropped.
              canvas = Image.new("RGB", (size, size), "white")
              fitted = source.copy()
              fitted.thumbnail((int(size * 0.90), int(size * 0.72)), Image.Resampling.LANCZOS)
              canvas.paste(fitted, ((size - fitted.width) // 2, (size - fitted.height) // 2))
              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)

              # Adaptive-icon foreground uses transparent space around the complete logo.
              foreground = Image.new("RGBA", (size * 2, size * 2), (255, 255, 255, 0))
              fitted_rgba = source.convert("RGBA")
              fitted_rgba.thumbnail((int(size * 1.20), int(size * 0.90)), Image.Resampling.LANCZOS)
              foreground.alpha_composite(
                  fitted_rgba,
                  ((foreground.width - fitted_rgba.width) // 2,
                   (foreground.height - fitted_rgba.height) // 2)
              )
              foreground.save(folder / "ic_launcher_foreground.png", optimize=True)

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive = """<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """
          (anydpi / "ic_launcher.xml").write_text(adaptive)
          (anydpi / "ic_launcher_round.xml").write_text(adaptive)

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "ic_launcher_background.xml"
          if colors.exists():
              tree = ET.parse(colors)
              root = tree.getroot()
              background = next((item for item in root.findall("color")
                                 if item.get("name") == "ic_launcher_background"), None)
              if background is None:
                  background = ET.SubElement(root, "color", {"name": "ic_launcher_background"})
              background.text = "#FFFFFF"
              tree.write(colors, encoding="utf-8", xml_declaration=True)
          else:
              colors.write_text("""<resources>
                  <color name="ic_launcher_background">#FFFFFF</color>
              </resources>
              """)

          print(f"Logo original validado: {source.width}x{source.height}")
          print("Ícones Android gerados em todas as densidades.")
          PY

      - name: Configurar assinatura permanente
        env:
          ERIMAX_KEYSTORE_BASE64: ${{ secrets.ERIMAX_KEYSTORE_BASE64 }}
          ERIMAX_STORE_PASSWORD: ${{ secrets.ERIMAX_STORE_PASSWORD }}
          ERIMAX_KEY_ALIAS: ${{ secrets.ERIMAX_KEY_ALIAS }}
          ERIMAX_KEY_PASSWORD: ${{ secrets.ERIMAX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for NAME in ERIMAX_KEYSTORE_BASE64 ERIMAX_STORE_PASSWORD ERIMAX_KEY_ALIAS ERIMAX_KEY_PASSWORD; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::Falta configurar o segredo do GitHub: $NAME"
              exit 1
            fi
          done
          printf '%s' "$ERIMAX_KEYSTORE_BASE64" | base64 --decode > android/app/erimax-signing-key.jks
          test -s android/app/erimax-signing-key.jks
          cat >> android/app/build.gradle <<'GRADLE'

          // Assinatura permanente do EriMax: os mesmos segredos são usados em todas as compilações.
          android {
              signingConfigs {
                  erimaxPermanent {
                      storeFile file("erimax-signing-key.jks")
                      storePassword System.getenv("ERIMAX_STORE_PASSWORD")
                      keyAlias System.getenv("ERIMAX_KEY_ALIAS")
                      keyPassword System.getenv("ERIMAX_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.erimaxPermanent
                  }
              }
          }
          GRADLE
          echo "Assinatura permanente configurada sem exibir credenciais."

      - name: Gerar APK
        env:
          ERIMAX_STORE_PASSWORD: ${{ secrets.ERIMAX_STORE_PASSWORD }}
          ERIMAX_KEY_ALIAS: ${{ secrets.ERIMAX_KEY_ALIAS }}
          ERIMAX_KEY_PASSWORD: ${{ secrets.ERIMAX_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          # Aumenta o timeout para evitar falha transitória ao baixar o Gradle.
          if grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          else
            printf '\nnetworkTimeout=120000\n' >> gradle/wrapper/gradle-wrapper.properties
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          echo "Tamanho do APK:"
          ls -lh "$APK"
          echo "Verificando assinatura:"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: erimax-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
